[workspace]
resolver = "2"
members = [
    "crates/crypto-core",      # Shared crypto library
    "crates/desktop-client",   # Tauri desktop application
    "crates/oracle",           # Oracle server
    "crates/storage-node",     # Storage nodes
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["XRPL Vault Team"]
license = "MIT"
repository = "https://github.com/your-org/xrpl-vault"

[workspace.dependencies]
# Криптография
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ecies = { version = "0.2", default-features = false, features = ["pure"] }
rand = "0.8"
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }

# XRPL (используем свою реализацию через WebSocket)
xrpl-rust = "1.0"  # Раскомментировать если нужна официальная библиотека

# Tauri
tauri = "2.0"
tauri-build = "2.0"

# HTTP Client
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Secure storage
keyring = "3.0"
directories = "5.0"

# QR Code
qrcode = "0.14"
image = "0.25"

# MIME type detection
mime_guess = "2.0"

# Utils
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Testing
proptest = "1.4"

[profile.release]
lto = true
codegen-units = 1
