[package]
name = "xrpl-vault-oracle"
version.workspace = true
edition.workspace = true
description = "Oracle service for Vaulted: registry, auth, manifests, QR coordination, grants, and storage tokens"

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
# Crypto primitives and legacy PRE compatibility
xrpl-vault-crypto-core = { path = "../crypto-core" }
ed25519-dalek.workspace = true
rand.workspace = true
# XRPL signature verification
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
sha2 = "0.10"

# Web framework
axum.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["cors", "trace", "limit"] }
tokio.workspace = true
futures-util.workspace = true

# Database
sqlx.workspace = true

# HTTP Client (для XRPL и storage nodes)
reqwest.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Utils
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
hex.workspace = true
xrpl-mithril = "0.5"
base64.workspace = true
umbral-pre = { version = "0.11.0", features = ["default-serialization", "serde"] }
ripemd = "0.1"
bs58 = "0.5"
url = "2"
redis = { workspace = true }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
blake3 = "1"
