[package]
name = "xrpl-vault-desktop"
version.workspace = true
edition.workspace = true
description = "XRPL Vault Desktop Client - Secure file encryption with NFT access control"

[lib]
name = "xrpl_vault_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# Crypto core (local)
xrpl-vault-crypto-core = { path = "../crypto-core" }
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Tauri
tauri.workspace = true
tauri-plugin-dialog = "2.0"

# Async
tokio.workspace = true
futures-util.workspace = true

# HTTP / WebSocket
reqwest.workspace = true
tokio-tungstenite.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Secure storage
keyring.workspace = true
directories.workspace = true

# QR Code
qrcode.workspace = true
image.workspace = true

# XRPL (custom implementation over WebSocket, no external dependencies)
# xrpl-rust.workspace = true  # Uncomment if the official library is needed

# MIME
mime_guess.workspace = true

# Utils
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }
chrono.workspace = true
hex.workspace = true
base64.workspace = true
dotenvy = "0.15.7"
zip = "8.5.1"
zeroize = "1.8.2"
aes-gcm = "0.10"
getrandom = "0.2"
sha2 = "0.10"
hostname = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
