[package]
name = "xrpl-vault-crypto-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Cryptographic primitives for Vaulted: AES-GCM, identity keys, KeyEnvelope, QR payloads, and local XRPL signing"

[dependencies]
# AES-256-GCM for file encryption
aes-gcm.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true

# Legacy PRE compatibility
umbral-pre = { version = "0.11", features = ["default-serialization"] }

# Random number generation
rand.workspace = true

# Hashing
sha2.workspace = true
blake3.workspace = true

# Key derivation
hkdf = "0.12"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
bip39 = { version = "2", features = ["rand"] }
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
ripemd = "0.1"
bs58 = "0.5"

# Encoding
hex.workspace = true
base64.workspace = true

# Serialization
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
xrpl-mithril-codec = "0.3.3"

# Error handling
thiserror.workspace = true

# Zeroize for securely clearing keys from memory
zeroize = { version = "1.8", features = ["derive"] }

# Constant-time comparison (MED-01: prevents timing attacks)
subtle = "2.5"

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
default = []
aes-ni = []
