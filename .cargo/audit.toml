[advisories]
ignore = [
  # sqlx-mysql/rsa is present in Cargo.lock metadata but is not reachable in the
  # active workspace dependency graph for Vaulted's configured database usage.
  "RUSTSEC-2023-0071",

  # Linux desktop stack: pulled transitively by Tauri/Wry/WebKitGTK.
  # These are not direct Vaulted dependencies and cannot be removed without
  # replacing the current Tauri Linux runtime stack.
  "RUSTSEC-2024-0411", # gdkwayland-sys: gtk-rs GTK3 bindings no longer maintained
  "RUSTSEC-2024-0412", # gdk: gtk-rs GTK3 bindings no longer maintained
  "RUSTSEC-2024-0413", # atk: gtk-rs GTK3 bindings no longer maintained
  "RUSTSEC-2024-0414", # gdkx11-sys: gtk-rs GTK3 bindings no longer maintained
  "RUSTSEC-2024-0415", # gtk: gtk-rs GTK3 bindings no longer maintained
  "RUSTSEC-2024-0416", # atk-sys: gtk-rs GTK3 bindings no longer maintained
  "RUSTSEC-2024-0417", # gdkx11: gtk-rs GTK3 bindings no longer maintained
  "RUSTSEC-2024-0418", # gdk-sys: gtk-rs GTK3 bindings no longer maintained
  "RUSTSEC-2024-0419", # gtk3-macros: gtk-rs GTK3 bindings no longer maintained
  "RUSTSEC-2024-0420", # gtk-sys: gtk-rs GTK3 bindings no longer maintained

  # Tauri/WebKitGTK transitive glib issue. Revisit when the Tauri Linux stack
  # moves to dependency versions that no longer pull glib 0.18.x.
  "RUSTSEC-2024-0429", # glib: VariantStrIter unsoundness

  # Transitive desktop/image stack warnings.
  "RUSTSEC-2024-0370", # proc-macro-error: pulled via gtk3-macros/glib-macros
  "RUSTSEC-2024-0436", # paste: pulled via rav1e/ravif/image
  "RUSTSEC-2025-0075", # unic-char-range: pulled via tauri-utils/urlpattern
  "RUSTSEC-2025-0080", # unic-common: pulled via tauri-utils/urlpattern
  "RUSTSEC-2025-0081", # unic-char-property: pulled via tauri-utils/urlpattern
  "RUSTSEC-2025-0098", # unic-ucd-version: pulled via tauri-utils/urlpattern
  "RUSTSEC-2025-0100", # unic-ucd-ident: pulled via tauri-utils/urlpattern
]
